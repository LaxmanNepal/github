name: Deploy GitHub Explorer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: node --check assets/js/app.js
      - name: Validate Python scripts
        run: |
          python -c "import ast; ast.parse(open('scripts/build_index.py', encoding='utf-8').read())"
          python -m py_compile scripts/build_index.py scripts/test_index.py
          python scripts/test_index.py
      - name: Validate project details script
        run: node --check assets/js/project.js
      - name: Validate dataset and directory configuration
        run: python -c "import json, pathlib; d=json.load(open('data/projects.json')); assert isinstance(d.get('projects'), list) and d['projects'], 'index must contain projects'; assert d.get('total', len(d['projects'])) == len(d['projects']); json.load(open('config/categories.json')); json.load(open('config/nepali-creators.json')); assert pathlib.Path('project/index.html').exists(); print('Dataset JSON valid:', len(d['projects']), 'projects')"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
