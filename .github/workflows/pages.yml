name: Deploy GitHub Explorer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/alternatives.js
          node --check assets/js/project.js
          node --check assets/js/compare.js
      - name: Validate Python scripts
        run: |
          python -c "import ast; ast.parse(open('scripts/build_index.py', encoding='utf-8').read())"
          python -c "import ast; ast.parse(open('scripts/test_index.py', encoding='utf-8').read())"
          python -c "import ast; ast.parse(open('scripts/build_feeds.py', encoding='utf-8').read())"
          python scripts/test_index.py
          python scripts/build_feeds.py
          python -c "import json; h=json.load(open('data/history.json')); assert isinstance(h.get('snapshots'), list) and h['snapshots']; import xml.etree.ElementTree as ET; ET.parse('feed.xml'); print('RSS XML and index history valid')"
      - name: Validate dataset and directory configuration
        run: python -c "import json, pathlib; d=json.load(open('data/projects.json')); assert isinstance(d.get('projects'), list) and d['projects'], 'index must contain projects'; assert d.get('total', len(d['projects'])) == len(d['projects']); json.load(open('config/categories.json')); json.load(open('config/nepali-creators.json')); assert pathlib.Path('project/index.html').exists(); assert pathlib.Path('alternatives/index.html').exists(); assert pathlib.Path('feed.xml').exists(); assert pathlib.Path('data/history.json').exists(); print('Dataset JSON valid:', len(d['projects']), 'projects')"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
